name: Release

# Push a tag like v0.1.0-preview.1 or v0.1.0. MinVer turns the tag into the package version.
# One-time setup on nuget.org: a Trusted Publishing policy for this repository and workflow file,
# and a repository secret NUGET_USER with the nuget.org account name (not an API key).
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # GitHub Release
  id-token: write  # NuGet Trusted Publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/PixelForge -c Release --no-build -o artifacts
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" artifacts/* --generate-notes $prerelease
