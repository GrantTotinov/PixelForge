name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native Skia assets differ per OS and architecture, so each one is tested.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build
      - if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes
      - if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/PixelForge -c Release --no-build -o artifacts
      - if: matrix.os == 'ubuntu-latest'
        name: Build benchmarks (outside the solution because of large native packages)
        run: |
          dotnet build benchmarks/PixelForge.Benchmarks -c Release -warnaserror
          dotnet format benchmarks/PixelForge.Benchmarks/PixelForge.Benchmarks.csproj --verify-no-changes

  alpine:
    name: alpine (musl x64)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build

  docker:
    name: docker sample (${{ matrix.variant || 'debian' }})
    strategy:
      fail-fast: false
      matrix:
        variant: ['', '-alpine']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f samples/UploadApi/Dockerfile --build-arg VARIANT=${{ matrix.variant }} -t uploadapi .
      - run: docker run -d -p 8080:8080 --name uploadapi uploadapi
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          code=$(curl -s -o thumb.webp -w '%{http_code}' -F file=@samples/UploadApi/sample.jpg http://localhost:8080/thumbnail)
          test "$code" = 200
          test "$(head -c 4 thumb.webp)" = RIFF
          code=$(curl -s -o /dev/null -w '%{http_code}' -F file=@README.md http://localhost:8080/thumbnail)
          test "$code" = 400
      - if: failure()
        run: docker logs uploadapi
